<!doctype html>
<html><head><meta charset="utf-8"><title>model preview</title>
<style>html,body{margin:0;background:#0b1210;color:#dfe6df;font:13px monospace}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
const only = params.get("only");
const catalog = await (await fetch("../../assets/models/catalog.json")).json();
const list = catalog.models.filter((m) => !only || m.category === only || m.id === only);

const cols = Math.ceil(Math.sqrt(list.length)), W = 1400, H = Math.ceil(list.length / cols) * (W / cols);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a2320);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 5, 4); scene.add(sun);
const cam = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
renderer.setScissorTest(true);

const cell = W / cols;
const loaded = await Promise.all(list.map((m) => new Promise((res) => loader.load("../../" + m.file, (g) => res({ m, g }), undefined, () => res({ m, g: null })))));
loaded.forEach(({ m, g }, i) => {
  const x = (i % cols) * cell, y = H - (Math.floor(i / cols) + 1) * cell;
  renderer.setViewport(x, y, cell, cell); renderer.setScissor(x, y, cell, cell);
  const s = new THREE.Scene(); s.background = scene.background; s.environment = scene.environment; s.add(sun.clone());
  if (g) {
    const root = g.scene; s.add(root);
    const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length();
    cam.position.copy(c).add(new THREE.Vector3(0.7, 0.8, 0.9).normalize().multiplyScalar(r * 1.25));
    cam.near = r / 100; cam.far = r * 10; cam.updateProjectionMatrix(); cam.lookAt(c);
  }
  renderer.render(s, cam);
});
document.title = "done";
const label = document.createElement("div");
label.style.cssText = "position:absolute;left:0;top:0;width:" + W + "px";
label.innerHTML = loaded.map(({ m, g }, i) => `<div style="position:absolute;left:${(i % cols) * cell + 6}px;top:${Math.floor(i / cols) * cell + 4}px">${m.category}/${m.id} ${g ? "" : "FAILED"} ${(m.triangles/1000|0)}k ${(m.bytes/1e6).toFixed(1)}MB</div>`).join("");
document.body.appendChild(label);
</script>
</body></html>
